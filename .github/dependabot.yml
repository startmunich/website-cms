# Dependabot version updates.
#
# Security updates are not configured here. They run off the repository's
# "Dependabot security updates" setting and need no config file; this file only
# adds routine version updates on top of them.
#
# Auto-merge is deliberately absent because dependabot.yml has no such key.
# GitHub rejects `auto-merge`, `permissions` and `insecure-external-code-
# execution` as unknown properties here — the last one is only supported for
# bundler, mix and pip, not npm. Dependabot auto-merge is enabled per pull
# request, or by a bot watching for them.
#
# Whatever enables it must be paired with the `ci` check being required by the
# `main branch protection` ruleset. Auto-merge only blocks on *required* status
# checks, so without that it merges dependency bumps the moment a PR becomes
# mergeable, with nothing verified.
#
# Configuration reference:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      # Deliberately Monday, not Wednesday. `update-skills.yml` refreshes the
      # vendored agent skills on Wednesday 04:23 UTC specifically so a skill
      # refresh never lands in the same window as a dependency bump. Monday is
      # also Dependabot's own default weekday, so keeping it costs nothing and
      # preserves that separation.
      day: monday
      # 05:00 Berlin is 03:00 UTC. Dependabot otherwise assigns a random time,
      # or 09:00 UTC by convention, so this lands off-peak and predictably.
      time: '05:00'
      timezone: Europe/Berlin
    groups:
      # Split by semver rather than by package name. Dependabot resolves a
      # dependency matching several groups into "the first group that it
      # matches", so a `patch` group alongside name-based groups for sanity,
      # react and eslint would make the outcome depend on YAML ordering.
      # Semver groups are mutually exclusive by construction, so every
      # dependency lands somewhere predictable.
      #
      # Keeping patch separate from minor means the high-volume, low-risk
      # patch PR does not hold up a minor bump that is worth reading. Majors
      # match neither group and so get an individual PR, which is what leaves
      # them open for a human to read.
      patch:
        applies-to: version-updates
        update-types:
          - patch
      minor:
        applies-to: version-updates
        update-types:
          - minor
      # No security-updates group on purpose. Grouping security updates would
      # let one that cannot be resolved hold up every other security fix
      # queued behind it.

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Berlin
    groups:
      actions-patch:
        applies-to: version-updates
        update-types:
          - patch
